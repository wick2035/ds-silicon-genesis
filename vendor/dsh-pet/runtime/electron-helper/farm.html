<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>大肥鱼的稻田</title>
  <link rel="stylesheet" href="./farm.css">
</head>
<body>
  <main class="farm">
    <header class="farm-header">
      <div><h1>大肥鱼的稻田</h1><p id="field-date">正在同步稻田</p></div>
      <button id="visit" type="button" disabled>带她进田</button>
    </header>
    <div class="farm-layout">
      <section id="scene" class="scene" data-weather="sunny" aria-label="斜俯视的立体卡通稻田">
        <img class="landscape" src="../../assets/farm/paddy.webp" alt="">
        <div id="crop" class="crop" aria-hidden="true"></div>
        <div class="weather-light" aria-hidden="true"></div>
        <img id="farmer" class="farmer" src="../../assets/farm/idle.webp" alt="大肥鱼" hidden>
        <div id="particles" class="particles" aria-hidden="true"></div>
        <p id="scene-caption" class="scene-caption" role="status">正在连接</p>
      </section>
      <aside class="field-notes" aria-label="田况与米缸">
        <div class="weather-reading">
          <svg id="weather-icon" data-kind="sunny" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <g data-symbol="sunny"><path d="M16 4v3m0 18v3m12-12h-3M7 16H4m20.5-8.5-2 2m-13 13-2 2m17 0-2-2m-13-13-2-2"/><circle cx="16" cy="16" r="5"/></g>
            <g data-symbol="rain"><path d="M8 17a4 4 0 0 1-.2-8 7 7 0 0 1 13.1 1.2A3.6 3.6 0 1 1 24 17ZM10 21l-2 5m9-5-2 5m9-5-2 5"/></g>
            <g data-symbol="hail"><path d="M8 17a4 4 0 0 1-.2-8 7 7 0 0 1 13.1 1.2A3.6 3.6 0 1 1 24 17Z"/><circle cx="9" cy="23" r="1.4"/><circle cx="17" cy="26" r="1.4"/><circle cx="24" cy="23" r="1.4"/></g>
            <g data-symbol="typhoon"><path d="M4 12h17a4 4 0 1 0-4-4M4 17h21a3 3 0 1 1-3 3M6 22h8a3 3 0 1 1-3 3"/></g>
          </svg>
          <div><span>稻田天气</span><strong id="weather">—</strong></div>
        </div>
        <section class="growing">
          <div class="field-label"><h2>水稻</h2><span id="stage">—</span></div>
          <ol class="growth-steps" id="growth" aria-label="累计达标日">
            <li>第 1 日</li><li>第 2 日</li><li>第 3 日</li>
          </ol>
          <p id="growth-detail">完成三个达标日后成熟。</p>
          <div class="field-label"><h2>水稻种子</h2><span id="seed-stock">—</span></div>
          <p id="seed-detail">按束计量</p>
          <div class="field-label"><h2>今日浇水</h2><span id="water">—</span></div>
          <p id="water-detail">每日零点结算</p>
        </section>
        <section class="granary">
          <svg viewBox="0 0 36 38" width="37" height="40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 10h22M8 10c-.4 6-4.3 9-4.3 16.7C3.7 33.5 10.4 36 18 36s14.3-2.5 14.3-9.3C32.3 19 28.4 16 28 10M25 29c2-1 3-3 3-5M7 10a2 2 0 0 1 0-4h22a2 2 0 0 1 0 4M13 6c0-2 1-4 5-4s5 2 5 4"/>
          </svg>
          <div><h2>米缸</h2><p><strong id="rice">—</strong> 碗生米</p></div>
        </section>
        <p id="harvest" class="harvest">生米需煮熟后才能吃</p>
      </aside>
    </div>
    <p id="feedback" class="feedback" role="status" hidden></p>
  </main>
  <script src="./farm.js"></script>
</body>
</html>
