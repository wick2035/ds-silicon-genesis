<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · 搬砖工地</title><link rel="stylesheet" href="./worksite.css"></head>
<body><main class="shell"><header><div><p class="place">大肥鱼的工作空间</p><h1>搬砖工地</h1><p class="intro">她在这里一步一步地搬，放下砖才算完成一趟。</p></div><button id="release" type="button" hidden>接她出去</button></header>
<section class="worksite" aria-label="搬砖工地"><div class="sky"><div id="state" class="state" role="status">正在连接她的世界…</div><div class="scene" id="scene"><div class="pile left"><span>待搬 <b id="remaining">—</b></span><div class="bricks" id="left-bricks"></div></div><div id="worker" role="button" aria-label="大肥鱼，点击或拖动互动" hidden tabindex="0"><video id="idle" src="../../assets/webm/待机呼吸休闲.webm" muted loop autoplay playsinline></video><img id="work-art" src="../../assets/labor-lift.png" alt="" draggable="false" hidden></div><div class="pile right"><span>已放好 <b id="done">—</b></span><div class="bricks" id="right-bricks"></div></div></div><div class="floor"></div></div></section>
<div class="footer"><div><strong id="headline">工地已经打开</strong><p id="detail">可以从桌面把她拖到这个窗口；她也会自己决定来工作。</p></div><div class="progress"><span id="count">等待工作约定</span><progress id="progress" max="1" value="0" aria-label="搬砖进度"></progress></div></div><p id="feedback" role="status" aria-live="polite"></p></main><script src="./worksite.js"></script></body></html>
